name: Build check

# Checks that the app analyses and builds on every branch except main
# (main is built and published by deploy-web.yml).

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          channel: stable
      - name: Create placeholder key file
        run: cp lib/secrets.example.dart lib/secrets.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release --base-href /weatherApp/
